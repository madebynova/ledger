<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1018">
    <meta name="description" content="LEDGER workspace application shell">
    <title>Dashboard — LEDGER</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace sidebar">
        <a class="brand" href="#dashboard" aria-label="LEDGER dashboard">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span class="brand-name">LEDGER</span>
        </a>

        <div class="workspace-switcher">
          <span class="workspace-avatar" aria-hidden="true">N</span>
          <span class="workspace-copy">
            <span class="workspace-label">WORKSPACE</span>
            <span class="workspace-name">Northstar Studio</span>
          </span>
          <span class="switcher-caret" aria-hidden="true">⌄</span>
        </div>

        <nav class="primary-nav" aria-label="Main navigation">
          <span class="nav-caption">MENU</span>
          <a class="nav-link" href="#dashboard" data-route="dashboard">
            <span class="nav-icon" aria-hidden="true">◫</span><span>Dashboard</span>
          </a>
          <a class="nav-link" href="#organization" data-route="organization">
            <span class="nav-icon" aria-hidden="true">⌂</span><span>Organization</span>
          </a>
          <a class="nav-link" href="#records" data-route="records">
            <span class="nav-icon" aria-hidden="true">▤</span><span>Records</span>
          </a>
          <a class="nav-link" href="#reports" data-route="reports">
            <span class="nav-icon" aria-hidden="true">▥</span><span>Reports</span>
          </a>
          <a class="nav-link" href="#settings" data-route="settings">
            <span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Workspace preview</span>
          <span class="preview-tag">DEMO</span>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <div class="breadcrumb">
            <span>Northstar Studio</span>
            <span class="breadcrumb-divider" aria-hidden="true">/</span>
            <span id="breadcrumb-current">Dashboard</span>
          </div>
          <div class="topbar-right">
            <span class="topbar-note">Application preview</span>
            <span class="topbar-avatar" aria-label="Workspace preview">N</span>
          </div>
        </header>

        <main id="main-content" class="main-content" tabindex="-1">
          <div id="page-content" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <nav class="mobile-nav" aria-label="Main navigation">
      <a class="mobile-nav-link" href="#dashboard" data-route="dashboard">
        <span class="nav-icon" aria-hidden="true">◫</span><span>Home</span>
      </a>
      <a class="mobile-nav-link" href="#organization" data-route="organization">
        <span class="nav-icon" aria-hidden="true">⌂</span><span>Org</span>
      </a>
      <a class="mobile-nav-link" href="#records" data-route="records">
        <span class="nav-icon" aria-hidden="true">▤</span><span>Records</span>
      </a>
      <a class="mobile-nav-link" href="#reports" data-route="reports">
        <span class="nav-icon" aria-hidden="true">▥</span><span>Reports</span>
      </a>
      <a class="mobile-nav-link" href="#settings" data-route="settings">
        <span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span>
      </a>
    </nav>
  </body>
</html>
